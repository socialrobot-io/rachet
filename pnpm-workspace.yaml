packages:
  - .
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/client': true
  '@swc/core': true
  '@temporalio/core-bridge': true
  better-sqlite3: true
  esbuild: true
  nx: true
  protobufjs: true

# Keep patched transitive versions until the parent packages adopt them.
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.28.2
  'minimatch@>=7 <11.0.1': 11.0.1
  'nx>undici': 7.30.2

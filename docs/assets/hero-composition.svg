<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">An agent builds a Rachet welcome journey</title>
  <desc id="desc">A request to welcome new users becomes a template, a validated journey, and simulations of both activation paths, ready for review.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#281916" stroke-opacity=".045"/></pattern>
    <symbol id="robot" viewBox="0 0 82 74">
      <g stroke="#281916" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 28Q5 27 4 34V47Q5 53 11 52L15 48 16 32Z" fill="#ffd43b" stroke-width="2.8"/>
        <path d="M70 27Q77 26 79 33V46Q78 53 72 52L68 48 67 32Z" fill="#ffd43b" stroke-width="2.8"/>
        <path d="M17 22Q22 15 33 14L53 13Q64 14 69 21L73 28Q76 34 75 45L74 52Q72 60 62 61L22 61Q12 60 10 52L9 37Q9 28 17 22Z" fill="#fffaf1" stroke-width="2.8"/>
        <path d="M27 16Q31 13 40 13L55 13Q60 14 64 17L61 21Q53 22 43 22L32 21Z" fill="#ffd43b" stroke-width="2.4"/>
        <path d="M23 28Q27 24 35 24L53 23Q62 24 66 30Q69 34 68 45Q67 53 59 55L29 55Q20 55 17 48Q15 40 18 33Q20 30 23 28Z" fill="#281916" stroke="none"/>
        <path d="M26 43Q28 37 32 36Q37 35 41 43M47 42Q49 36 53 36Q58 36 60 42" fill="none" stroke="#ffd43b" stroke-width="4.7"/>
      </g>
    </symbol>
    <style>
      .ink{fill:#281916}.muted{fill:#756b65}.mono{font-family:monospace;letter-spacing:2px}.body{font-family:Arial,Helvetica,sans-serif}.line{fill:none;stroke:#281916;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.soft{fill:#fffdf8;stroke:#281916;stroke-opacity:.22;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fffaf1"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1514" cy="96" r="80" fill="#f8d4e7" opacity=".55"/>
  <path d="M1492 115l12-17 14 10 17-20" class="line" stroke-width="3" opacity=".55"/>
  <use href="#robot" x="65" y="47" width="62" height="56"/>
  <text x="139" y="94" class="body ink" font-size="43" font-weight="800" letter-spacing="-2">Rachet</text>
  <text x="1285" y="86" class="mono muted" font-size="15">AGENT + MCP</text>
  <path d="M66 125H1534" class="line" opacity=".15"/>

  <text x="86" y="188" class="mono muted" font-size="16">01 / YOU ASK</text>
  <rect x="88" y="219" width="612" height="266" rx="24" fill="#281916" opacity=".08" transform="translate(7 8) rotate(-1 394 352)"/>
  <rect x="88" y="219" width="612" height="266" rx="24" fill="#ffe27a" stroke="#281916" stroke-opacity=".55" stroke-width="2.5" transform="rotate(-1 394 352)"/>
  <text x="125" y="290" class="body ink" font-size="37" font-weight="700">Welcome new users.</text>
  <text x="125" y="347" class="body ink" font-size="30">If they have not activated after</text>
  <text x="125" y="393" class="body ink" font-size="30">24 hours, send one reminder.</text>
  <path d="M128 427Q307 435 496 426" class="line" stroke-width="3" opacity=".6"/>
  <path d="M711 351h60m-18-17 18 17-18 17" class="line" stroke-width="4"/>

  <text x="87" y="578" class="body ink" font-size="51" font-weight="800" letter-spacing="-2">Your agent authors.</text>
  <text x="87" y="645" class="body ink" font-size="51" font-weight="800" letter-spacing="-2">You approve.</text>
  <rect x="88" y="673" width="282" height="62" rx="11" fill="#bfead0" transform="rotate(-2 229 704)"/>
  <text x="103" y="719" class="body ink" font-size="51" font-weight="800" letter-spacing="-2">Rachet runs.</text>
  <path d="M530 629l13-24m8 29 27-12m-26 25 26 6" class="line" stroke="#e9aa20" stroke-width="5"/>

  <rect x="797" y="177" width="714" height="616" rx="26" fill="#281916" opacity=".08" transform="translate(9 10)"/>
  <rect x="797" y="177" width="714" height="616" rx="26" class="soft"/>
  <use href="#robot" x="828" y="203" width="72" height="65"/>
  <text x="920" y="249" class="body ink" font-size="32" font-weight="800">Built and checked</text>
  <rect x="1257" y="214" width="208" height="39" rx="19" fill="#bfead0"/>
  <circle cx="1284" cy="233" r="6" fill="#24835a"/>
  <text x="1302" y="239" class="mono ink" font-size="13" letter-spacing="1">READY TO REVIEW</text>
  <path d="M829 283H1478" class="line" opacity=".15"/>

  <circle cx="845" cy="324" r="15" fill="#bfead0"/><path d="m838 324 5 5 10-12" class="line" stroke="#1f744e" stroke-width="2.7"/>
  <text x="877" y="333" class="body ink" font-size="23">Welcome template created</text>
  <circle cx="845" cy="372" r="15" fill="#bfead0"/><path d="m838 372 5 5 10-12" class="line" stroke="#1f744e" stroke-width="2.7"/>
  <text x="877" y="381" class="body ink" font-size="23">Journey graph validated</text>
  <circle cx="845" cy="420" r="15" fill="#bfead0"/><path d="m838 420 5 5 10-12" class="line" stroke="#1f744e" stroke-width="2.7"/>
  <text x="877" y="429" class="body ink" font-size="23">Both paths simulated</text>

  <rect x="829" y="470" width="650" height="282" rx="21" fill="#fffaf1" stroke="#281916" stroke-opacity=".22" stroke-width="2"/>
  <text x="856" y="508" class="mono muted" font-size="13">THE JOURNEY</text>
  <rect x="854" y="533" width="161" height="57" rx="12" fill="#fffdf8" stroke="#281916" stroke-opacity=".25" stroke-width="2"/>
  <circle cx="878" cy="562" r="7" fill="#58aa82"/>
  <text x="897" y="569" class="body ink" font-size="19" font-weight="700">New user</text>
  <path d="M1015 561h29m-9-9 9 9-9 9" class="line"/>
  <rect x="1045" y="533" width="169" height="57" rx="12" fill="#f6c9e4" stroke="#281916" stroke-opacity=".22" stroke-width="2"/>
  <text x="1063" y="568" class="body ink" font-size="19" font-weight="700">Send welcome</text>
  <path d="M1214 561h28m-9-9 9 9-9 9" class="line"/>
  <rect x="1243" y="533" width="205" height="57" rx="12" fill="#ffe27a" stroke="#281916" stroke-opacity=".22" stroke-width="2"/>
  <text x="1263" y="568" class="body ink" font-size="19" font-weight="700">Wait up to 24h</text>
  <path d="M1346 590v41m0 0h-210m210 0h0m-210 0v21m210-21h1m-1 0v21" class="line" stroke-width="2"/>
  <path d="m1128 644 8 8 8-8m194 0 8 8 8-8" class="line" stroke-width="2"/>
  <text x="1068" y="627" class="mono muted" font-size="12">ACTIVATED</text>
  <text x="1298" y="627" class="mono muted" font-size="12">NOT YET</text>
  <rect x="1040" y="652" width="190" height="59" rx="12" fill="#bfead0" stroke="#281916" stroke-opacity=".22" stroke-width="2"/>
  <text x="1093" y="688" class="body ink" font-size="19" font-weight="700">End</text>
  <rect x="1250" y="652" width="198" height="59" rx="12" fill="#fffdf8" stroke="#281916" stroke-opacity=".22" stroke-width="2"/>
  <text x="1268" y="688" class="body ink" font-size="18" font-weight="700">Send reminder</text>
  <text x="1294" y="733" class="mono muted" font-size="12">THEN END</text>
  <path d="M66 839H1534" class="line" opacity=".15"/>
  <text x="67" y="867" class="mono muted" font-size="13">DESCRIBE IT  /  CHECK IT  /  RUN IT</text>
</svg>

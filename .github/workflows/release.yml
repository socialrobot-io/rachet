name: Release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.8.0 --activate
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@latest
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify repository
        run: make check
      - name: Verify tag matches CLI package version
        run: |
          expected="v$(node -p 'require("./packages/cli/package.json").version')"
          test "${GITHUB_REF_NAME}" = "${expected}"
      - name: Publish CLI with provenance
        run: pnpm --filter @socialrobot-io/rachet publish --no-git-checks --provenance
      - name: Publish SDK with provenance
        run: pnpm --filter @socialrobot-io/rachet-sdk publish --no-git-checks --provenance
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm nx release changelog "${GITHUB_REF_NAME#v}"

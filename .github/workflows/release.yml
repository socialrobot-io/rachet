name: Release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.8.0 --activate
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@latest
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify repository
        run: make check
      - name: Verify tag matches CLI package version
        run: |
          expected="v$(node -p 'require("./packages/cli/package.json").version')"
          test "${GITHUB_REF_NAME}" = "${expected}"
      - name: Check package versions in npm
        id: npm_versions
        run: |
          cli="@socialrobot-io/rachet@$(node -p 'require("./packages/cli/package.json").version')"
          sdk="@socialrobot-io/rachet-sdk@$(node -p 'require("./packages/sdk/package.json").version')"
          if npm view "${cli}" version >/dev/null 2>&1; then echo "cli_published=true" >> "$GITHUB_OUTPUT"; else echo "cli_published=false" >> "$GITHUB_OUTPUT"; fi
          if npm view "${sdk}" version >/dev/null 2>&1; then echo "sdk_published=true" >> "$GITHUB_OUTPUT"; else echo "sdk_published=false" >> "$GITHUB_OUTPUT"; fi
      - name: Rebuild and verify CLI publish artifact
        run: pnpm nx run cli:build --skipNxCache && pnpm --filter @socialrobot-io/rachet verify:artifact
      - name: Publish CLI with provenance
        if: steps.npm_versions.outputs.cli_published != 'true'
        run: pnpm --filter @socialrobot-io/rachet publish --no-git-checks --provenance
      - name: Publish SDK with provenance
        if: steps.npm_versions.outputs.sdk_published != 'true'
        run: pnpm --filter @socialrobot-io/rachet-sdk publish --no-git-checks --provenance
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "Rachet ${GITHUB_REF_NAME}" --generate-notes

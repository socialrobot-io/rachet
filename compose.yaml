name: reflow

x-reflow: &reflow
  image: reflow:${REFLOW_VERSION:-local}
  build: .
  restart: unless-stopped
  environment:
    NODE_ENV: production
    PORT: 3000
    PUBLIC_URL: https://${REFLOW_DOMAIN:?Set REFLOW_DOMAIN}
    DATABASE_URL: '${DATABASE_URL:?Set DATABASE_URL}'
    BETTER_AUTH_SECRET: '${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}'
    REFLOW_SETUP_SECRET: '${REFLOW_SETUP_SECRET:?Set REFLOW_SETUP_SECRET}'
    ALLOW_REGISTRATION: '${ALLOW_REGISTRATION:-false}'
    TRUSTED_ORIGINS: 'https://${REFLOW_DOMAIN:?Set REFLOW_DOMAIN}'
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_NAMESPACE: reflow
    INTEGRATION_ENCRYPTION_KEY: '${INTEGRATION_ENCRYPTION_KEY:?Set INTEGRATION_ENCRYPTION_KEY}'
    AUTH_RESEND_API_KEY: '${AUTH_RESEND_API_KEY:-}'
    AUTH_EMAIL_FROM: '${AUTH_EMAIL_FROM:-}'
    GITHUB_CLIENT_ID: '${GITHUB_CLIENT_ID:-}'
    GITHUB_CLIENT_SECRET: '${GITHUB_CLIENT_SECRET:-}'
    OAUTH_PROVIDER_ID: '${OAUTH_PROVIDER_ID:-}'
    OAUTH_DISCOVERY_URL: '${OAUTH_DISCOVERY_URL:-}'
    OAUTH_CLIENT_ID: '${OAUTH_CLIENT_ID:-}'
    OAUTH_CLIENT_SECRET: '${OAUTH_CLIENT_SECRET:-}'
    OAUTH_PUBLIC_REDIRECT_ORIGINS: '${OAUTH_PUBLIC_REDIRECT_ORIGINS:-}'
    OAUTH_PUBLIC_REDIRECT_SCHEMES: '${OAUTH_PUBLIC_REDIRECT_SCHEMES:-cursor}'
  depends_on:
    migrate: { condition: service_completed_successfully }
    temporal-namespace: { condition: service_completed_successfully }
  networks: [reflow]
  read_only: true
  tmpfs: [/tmp]
  security_opt: ['no-new-privileges:true']

x-temporal-admin-tools: &temporal-admin-tools
  image: reflow-temporal-admin-tools:${REFLOW_VERSION:-local}
  build:
    context: .
    dockerfile: docker/temporal/admin-tools.Dockerfile

x-temporal-server: &temporal-server
  image: reflow-temporal-server:${REFLOW_VERSION:-local}
  build:
    context: .
    dockerfile: docker/temporal/server.Dockerfile

x-caddy: &caddy
  image: reflow-caddy:${REFLOW_VERSION:-local}
  build:
    context: .
    dockerfile: docker/caddy.Dockerfile

services:
  postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: reflow
      POSTGRES_USER: reflow
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}'
    volumes: ['reflow-db:/var/lib/postgresql/data']
    healthcheck: { test: [CMD-SHELL, pg_isready -U reflow -d reflow], interval: 5s, timeout: 5s, retries: 20 }
    networks: [reflow]

  temporal-postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: '${TEMPORAL_POSTGRES_PASSWORD:?Set TEMPORAL_POSTGRES_PASSWORD}'
    volumes: ['temporal-db:/var/lib/postgresql/data']
    healthcheck: { test: [CMD-SHELL, pg_isready -U temporal], interval: 5s, timeout: 5s, retries: 20 }
    networks: [reflow]

  temporal-schema:
    <<: *temporal-admin-tools
    restart: on-failure:5
    depends_on: { temporal-postgres: { condition: service_healthy } }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_PWD: '${TEMPORAL_POSTGRES_PASSWORD:?Set TEMPORAL_POSTGRES_PASSWORD}'
      SQL_PASSWORD: '${TEMPORAL_POSTGRES_PASSWORD:?Set TEMPORAL_POSTGRES_PASSWORD}'
    entrypoint: [/bin/sh]
    command: [/scripts/setup-postgres.sh]
    networks: [reflow]

  temporal:
    <<: *temporal-server
    restart: unless-stopped
    depends_on: { temporal-schema: { condition: service_completed_successfully } }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_PWD: '${TEMPORAL_POSTGRES_PASSWORD:?Set TEMPORAL_POSTGRES_PASSWORD}'
      SQL_PASSWORD: '${TEMPORAL_POSTGRES_PASSWORD:?Set TEMPORAL_POSTGRES_PASSWORD}'
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/production-sql.yaml
    healthcheck: { test: [CMD, nc, -z, localhost, '7233'], interval: 5s, timeout: 3s, retries: 30 }
    networks: [reflow]

  temporal-namespace:
    <<: *temporal-admin-tools
    restart: on-failure:5
    depends_on: { temporal: { condition: service_healthy } }
    environment: { TEMPORAL_ADDRESS: 'temporal:7233', DEFAULT_NAMESPACE: reflow }
    entrypoint: [/bin/sh]
    command: [/scripts/create-namespace.sh]
    networks: [reflow]

  migrate:
    <<: *reflow
    restart: 'no'
    command: [node, dist/apps/server/db/migrate.js]
    depends_on: { postgres: { condition: service_healthy } }

  app:
    <<: *reflow
    healthcheck: { test: [CMD, node, -e, "fetch('http://localhost:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)})"], interval: 10s, timeout: 5s, retries: 10 }

  worker:
    <<: *reflow
    command: [node, dist/apps/server/worker.js]

  dispatcher:
    <<: *reflow
    command: [node, dist/apps/server/dispatcher.js]

  # Opt-in TLS ingress for bare hosts. Off by default so Coolify (or any
  # external proxy) can terminate TLS and route to app:3000 without binding
  # host ports 80/443. Enable with: COMPOSE_PROFILES=caddy or --profile caddy
  caddy:
    <<: *caddy
    profiles: [caddy]
    restart: unless-stopped
    depends_on: { app: { condition: service_healthy } }
    environment:
      REFLOW_DOMAIN: '${REFLOW_DOMAIN:?Set REFLOW_DOMAIN}'
      ACME_EMAIL: '${ACME_EMAIL:-}'
    ports: ['80:80', '443:443', '443:443/udp']
    volumes: ['caddy-data:/data', 'caddy-config:/config']
    networks: [reflow]

volumes: { reflow-db: {}, temporal-db: {}, caddy-data: {}, caddy-config: {} }
networks: { reflow: {} }

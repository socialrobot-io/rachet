name: reflow

x-rachet: &rachet
  restart: unless-stopped
  environment:
    NODE_ENV: production
    PORT: 3000
    PUBLIC_URL: https://${RACHET_DOMAIN:-${REFLOW_DOMAIN:?Set RACHET_DOMAIN}}
    GOOGLE_ANALYTICS_ID: '${GOOGLE_ANALYTICS_ID:-}'
    DATABASE_URL: '${DATABASE_URL:?Set DATABASE_URL}'
    BETTER_AUTH_SECRET: '${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}'
    RACHET_SETUP_SECRET: '${RACHET_SETUP_SECRET:-${REFLOW_SETUP_SECRET:?Set RACHET_SETUP_SECRET}}'
    ALLOW_REGISTRATION: '${ALLOW_REGISTRATION:-false}'
    TRUSTED_ORIGINS: 'https://${RACHET_DOMAIN:-${REFLOW_DOMAIN:?Set RACHET_DOMAIN}}'
    TEMPORAL_ADDRESS: temporal:7233
    TEMPORAL_NAMESPACE: '${TEMPORAL_NAMESPACE:-reflow}'
    TEMPORAL_TASK_QUEUE: '${TEMPORAL_TASK_QUEUE:-reflow-enrollments}'
    INTEGRATION_ENCRYPTION_KEY: '${INTEGRATION_ENCRYPTION_KEY:?Set INTEGRATION_ENCRYPTION_KEY}'
    AUTH_RESEND_API_KEY: '${AUTH_RESEND_API_KEY:-}'
    AUTH_EMAIL_FROM: '${AUTH_EMAIL_FROM:-}'
    RACHET_API_KEY: '${RACHET_API_KEY:-${REFLOW_API_KEY:-}}'
    RACHET_WORKSPACE_ID: '${RACHET_WORKSPACE_ID:-${REFLOW_WORKSPACE_ID:-}}'
    GITHUB_CLIENT_ID: '${GITHUB_CLIENT_ID:-}'
    GITHUB_CLIENT_SECRET: '${GITHUB_CLIENT_SECRET:-}'
    OAUTH_PROVIDER_ID: '${OAUTH_PROVIDER_ID:-}'
    OAUTH_DISCOVERY_URL: '${OAUTH_DISCOVERY_URL:-}'
    OAUTH_CLIENT_ID: '${OAUTH_CLIENT_ID:-}'
    OAUTH_CLIENT_SECRET: '${OAUTH_CLIENT_SECRET:-}'
    OAUTH_PUBLIC_REDIRECT_ORIGINS: '${OAUTH_PUBLIC_REDIRECT_ORIGINS:-}'
    OAUTH_PUBLIC_REDIRECT_SCHEMES: '${OAUTH_PUBLIC_REDIRECT_SCHEMES:-cursor}'
  depends_on:
    migrate: { condition: service_completed_successfully }
    temporal-namespace: { condition: service_completed_successfully }
  networks: [reflow]
  read_only: true
  tmpfs: [/tmp]
  security_opt: ['no-new-privileges:true']

x-temporal-admin-tools: &temporal-admin-tools
  image: rachet-temporal-admin-tools:${RACHET_VERSION:-${REFLOW_VERSION:-local}}
  build:
    context: .
    dockerfile: docker/temporal/admin-tools.Dockerfile

x-temporal-server: &temporal-server
  image: rachet-temporal-server:${RACHET_VERSION:-${REFLOW_VERSION:-local}}
  build:
    context: .
    dockerfile: docker/temporal/server.Dockerfile

x-caddy: &caddy
  image: rachet-caddy:${RACHET_VERSION:-${REFLOW_VERSION:-local}}
  build:
    context: .
    dockerfile: docker/caddy.Dockerfile

services:
  postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: '${RACHET_DB_NAME:-reflow}'
      POSTGRES_USER: '${RACHET_DB_USER:-reflow}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}'
    volumes: ['reflow-db:/var/lib/postgresql/data']
    healthcheck: { test: [CMD-SHELL, 'pg_isready -U ${RACHET_DB_USER:-reflow} -d ${RACHET_DB_NAME:-reflow}'], interval: 5s, timeout: 5s, retries: 20 }
    networks: [reflow]

  temporal-postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: '${TEMPORAL_POSTGRES_PASSWORD:?Set TEMPORAL_POSTGRES_PASSWORD}'
    volumes: ['temporal-db:/var/lib/postgresql/data']
    healthcheck: { test: [CMD-SHELL, pg_isready -U temporal], interval: 5s, timeout: 5s, retries: 20 }
    networks: [reflow]

  temporal-schema:
    <<: *temporal-admin-tools
    restart: on-failure:5
    depends_on: { temporal-postgres: { condition: service_healthy } }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_PWD: '${TEMPORAL_POSTGRES_PASSWORD:?Set TEMPORAL_POSTGRES_PASSWORD}'
      SQL_PASSWORD: '${TEMPORAL_POSTGRES_PASSWORD:?Set TEMPORAL_POSTGRES_PASSWORD}'
    entrypoint: [/bin/sh]
    command: [/scripts/setup-postgres.sh]
    networks: [reflow]

  temporal:
    <<: *temporal-server
    restart: unless-stopped
    depends_on: { temporal-schema: { condition: service_completed_successfully } }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_PWD: '${TEMPORAL_POSTGRES_PASSWORD:?Set TEMPORAL_POSTGRES_PASSWORD}'
      SQL_PASSWORD: '${TEMPORAL_POSTGRES_PASSWORD:?Set TEMPORAL_POSTGRES_PASSWORD}'
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/production-sql.yaml
    healthcheck: { test: [CMD, nc, -z, localhost, '7233'], interval: 5s, timeout: 3s, retries: 30 }
    networks: [reflow]

  temporal-namespace:
    <<: *temporal-admin-tools
    restart: on-failure:5
    depends_on: { temporal: { condition: service_healthy } }
    environment: { TEMPORAL_ADDRESS: 'temporal:7233', DEFAULT_NAMESPACE: '${TEMPORAL_NAMESPACE:-reflow}' }
    entrypoint: [/bin/sh]
    command: [/scripts/create-namespace.sh]
    networks: [reflow]

  migrate:
    <<: *rachet
    image: rachet-worker:${RACHET_VERSION:-${REFLOW_VERSION:-local}}
    build: { context: ., target: worker }
    restart: 'no'
    command: [node, dist/apps/server/db/migrate.js]
    depends_on: { postgres: { condition: service_healthy } }

  app:
    <<: *rachet
    image: rachet-app:${RACHET_VERSION:-${REFLOW_VERSION:-local}}
    build: { context: ., target: app }
    healthcheck:
      test: [CMD, node, docker/healthcheck-ready.js]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    <<: *rachet
    image: rachet-worker:${RACHET_VERSION:-${REFLOW_VERSION:-local}}
    build: { context: ., target: worker }

  dispatcher:
    <<: *rachet
    image: rachet-dispatcher:${RACHET_VERSION:-${REFLOW_VERSION:-local}}
    build: { context: ., target: dispatcher }

  # Opt-in TLS ingress for bare hosts. Off by default so Coolify (or any
  # external proxy) can terminate TLS and route to app:3000 without binding
  # host ports 80/443. Enable with: COMPOSE_PROFILES=caddy or --profile caddy
  caddy:
    <<: *caddy
    profiles: [caddy]
    restart: unless-stopped
    depends_on: { app: { condition: service_healthy } }
    environment:
      RACHET_DOMAIN: '${RACHET_DOMAIN:-${REFLOW_DOMAIN:?Set RACHET_DOMAIN}}'
      ACME_EMAIL: '${ACME_EMAIL:-}'
    ports: ['80:80', '443:443', '443:443/udp']
    volumes: ['caddy-data:/data', 'caddy-config:/config']
    networks: [reflow]

volumes: { reflow-db: {}, temporal-db: {}, caddy-data: {}, caddy-config: {} }
networks: { reflow: {} }
